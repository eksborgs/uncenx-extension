name: Build Extension

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle & Generate Log
        run: |
          mkdir -p logs
          gradle build --no-daemon --info 2>&1 | tee logs/build.log

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-execution-log
          path: logs/build.log

      - name: Upload Built Plugins
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: cloudstream-plugins
          path: "**/*.cs3"
