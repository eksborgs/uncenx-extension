name: Build Extension

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Execute Gradle Build & Capture Log
        run: |
          mkdir -p logs
          chmod +x ./gradlew || true
          gradle build --no-daemon 2>&1 | tee logs/build.log

      - name: Upload Auto Log
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-execution-log
          path: logs/build.log
